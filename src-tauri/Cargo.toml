[package]
name = "tachyon-studio"
version = "2.5.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dunce = "1.0"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Optimización para que la compilación ocupe mucho menos espacio en disco:
# 1. En debug: reducir símbolos de depuración pesados a 'line-tables-only' (debug = 1),
#    lo que reduce el tamaño de target/ en más de un 60-70% (archivos .pdb gigantes en Windows).
[profile.dev]
debug = 1
incremental = true

# 2. En release: reducir tamaño final del binario y evitar archivos de depuración redundantes.
[profile.release]
debug = 0
strip = true
lto = "thin"
opt-level = "z"
panic = "abort"
codegen-units = 1
